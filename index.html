<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CiteCraft — Manage and showcase your publications</title>
    <meta
      name="description"
      content="CiteCraft helps faculty and researchers manage publications, import from DOI or BibTeX, track h-index and citations, export CVs and share a public research profile."
    />
    <meta name="author" content="Aryan Singh, Kartik Mitra" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="CiteCraft — Manage and showcase your publications" />
    <meta
      property="og:description"
      content="Import publications by DOI or BibTeX, track your h-index, export CVs and share a public research profile."
    />
    <meta property="og:url" content="https://citecraft.netlify.app/" />
    <meta name="twitter:card" content="summary" />

    <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
    <script>
      try {
        var t = localStorage.getItem('citecraft-theme');
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <noscript>CiteCraft needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
