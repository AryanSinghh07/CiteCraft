name: CI

on:
  push:
    branches: [main, v2-dev]
  pull_request:

permissions:
  contents: read

# Only the newest push on a branch needs checking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build
        run: npm run build
