name: Release

# Push a version tag (e.g. v2.0.0) to publish:
#   - a GitHub Release with notes from docs/releases/<tag>.md and the built site as a .zip
#   - a Docker image on GitHub Packages: ghcr.io/<owner>/citecraft:<version> and :latest
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build (demo mode — add your own Supabase keys when you deploy)
        run: npm run build
      - name: Package the site
        run: cd dist && zip -qr "../citecraft-${GITHUB_REF_NAME}-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: citecraft-*-web.zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/citecraft
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [web, docker]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: web
      - name: Release notes
        run: |
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/citecraft"
          { cat "docs/releases/${GITHUB_REF_NAME}.md"; printf '\n## Docker image\n\n```bash\ndocker run -p 8080:80 %s:%s\n```\n' "$IMAGE" "${GITHUB_REF_NAME#v}"; } > notes.md
      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" citecraft-*-web.zip \
            --title "CiteCraft ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag --latest
      # The original version predates this workflow; give its tag a release too.
      - name: Release for the original version
        run: |
          if git rev-parse -q --verify refs/tags/v1.0.0 >/dev/null && ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 --title "CiteCraft v1.0.0 (original version)" \
              --notes-file docs/releases/v1.0.0.md --verify-tag --latest=false
          fi
